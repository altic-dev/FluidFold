name: Hinge
options:
  bundleIdPrefix: com.altic
  deploymentTarget:
    macOS: "15.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "15.2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: TEAMID
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Hinge:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: ["Effect/Shaders/**"]
      - path: Sources/Effect/Shaders
        type: folder
        buildPhase: resources
    entitlements:
      path: Hinge.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Hinge
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.2"
        NSScreenCaptureUsageDescription: Hinge captures your desktop to animate it while the lid closes. Nothing is recorded or saved.
        NSHumanReadableCopyright: Copyright © 2026 Altic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altic.Hinge
        PRODUCT_NAME: Hinge
        CODE_SIGN_ENTITLEMENTS: Hinge.entitlements
        SWIFT_OPTIMIZATION_LEVEL: "-O"
schemes:
  Hinge:
    build:
      targets:
        Hinge: all
    run:
      config: Release
