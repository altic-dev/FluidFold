name: FluidFold
options:
  bundleIdPrefix: com.altic
  deploymentTarget:
    macOS: "15.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "15.2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"
targets:
  FluidFold:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: ["Effect/Shaders/**"]
      - path: Sources/Effect/Shaders
        type: folder
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: Sparkle
    entitlements:
      path: FluidFold.entitlements
      properties: {}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FluidFold
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        LSMinimumSystemVersion: "15.2"
        NSScreenCaptureUsageDescription: FluidFold captures your desktop to animate it while the lid closes. Nothing is recorded or saved.
        NSHumanReadableCopyright: Copyright © 2026 Altic
        SUFeedURL: "$(SPARKLE_FEED_URL)"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altic.FluidFold
        PRODUCT_NAME: FluidFold
        CODE_SIGN_ENTITLEMENTS: FluidFold.entitlements
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.1
        SPARKLE_FEED_URL: https://github.com/altic-dev/FluidFold/releases/latest/download/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: "5GbAfhMoLQPgU22ur80o0atj8QTYJvRnf1AH66+DZs4="
schemes:
  FluidFold:
    build:
      targets:
        FluidFold: all
    run:
      config: Release
